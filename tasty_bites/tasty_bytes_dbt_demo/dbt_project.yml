## Project
name: tasty_bytes
version: "1.0"
config-version: 2
profile: tasty_bytes

## Sources
model-paths: [models]
analysis-paths: [analysis]
test-paths: [tests]
seed-paths: [seeds]
macro-paths: [macros]
snapshot-paths: [snapshots]

## Target
target-path: target
clean-targets: [target, dbt_modules]

## Models
models:
  tasty_bytes:
    staging:
      +materialized: view
    marts:
      +materialized: table

## Query comments
# Append dbt's JSON query comment (includes node_id) to the end of each query so
# QUERY_HISTORY.query_text can be attributed back to individual models.
query-comment:
  append: true
